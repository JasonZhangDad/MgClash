name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2022
          - target: linux-x86_64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
          node-version: 22.17.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Test frontend
        working-directory: apps/desktop
        run: npm test
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Show compiler target
        run: rustc --version --verbose
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check frontend coverage
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run test:coverage
      - name: Install Rust coverage tooling
        if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Enforce 80% line coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --workspace --locked --fail-under-lines 80
      - name: Build unsigned desktop binary
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
