name: Release (unsigned)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  SING_BOX_VERSION: "1.13.18"
  WINTUN_VERSION: "0.14.1"
  WINTUN_ARCHIVE_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            core_asset: sing-box-1.13.18-darwin-amd64.tar.gz
            core_archive_sha256: 500f0decfc21f7cdb2aaa4fe193b7857a41b07c38ee3a0b15bd53e3c7af3671c
            core_directory: sing-box-1.13.18-darwin-amd64
            core_file_name: sing-box
          - target: macos-aarch64
            runner: macos-15
            core_asset: sing-box-1.13.18-darwin-arm64.tar.gz
            core_archive_sha256: 9fbc05946b584423457a2778035e0cee2d9b239a4af5ae1932d9b79991149107
            core_directory: sing-box-1.13.18-darwin-arm64
            core_file_name: sing-box
          - target: windows-x86_64
            runner: windows-2022
            core_asset: sing-box-1.13.18-windows-amd64.zip
            core_archive_sha256: 65045155ffdc506334f01a4353889657ddfc024f72b394081a9abaef34dfbef3
            core_directory: sing-box-1.13.18-windows-amd64
            core_file_name: sing-box.exe
          - target: linux-x86_64
            runner: ubuntu-22.04
            core_asset: sing-box-1.13.18-linux-amd64.tar.gz
            core_archive_sha256: d34d987ed6ae39ca3760269264fb502b867e5477db45518c829b07776245c495
            core_directory: sing-box-1.13.18-linux-amd64
            core_file_name: sing-box
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
          node-version: 22.17.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Test release scripts
        shell: bash
        run: |
          bash scripts/tests/stage-bundled-core.sh
          bash scripts/tests/stage-bundled-wintun.sh
      - name: Prepare pinned sing-box
        shell: bash
        env:
          SING_BOX_ASSET: ${{ matrix.core_asset }}
          SING_BOX_ARCHIVE_SHA256: ${{ matrix.core_archive_sha256 }}
          SING_BOX_DIRECTORY: ${{ matrix.core_directory }}
          SING_BOX_FILE_NAME: ${{ matrix.core_file_name }}
        run: |
          set -euo pipefail

          runner_temp="${RUNNER_TEMP}"
          github_env="${GITHUB_ENV}"
          if command -v cygpath >/dev/null 2>&1; then
            runner_temp="$(cygpath -u "${runner_temp}")"
            github_env="$(cygpath -u "${github_env}")"
          fi

          archive="${runner_temp}/${SING_BOX_ASSET}"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${SING_BOX_ASSET}"

          if command -v shasum >/dev/null 2>&1; then
            actual_archive_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          else
            actual_archive_sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          fi
          if [[ "${actual_archive_sha256}" != "${SING_BOX_ARCHIVE_SHA256}" ]]; then
            echo "sing-box archive SHA-256 mismatch" >&2
            exit 1
          fi

          case "${SING_BOX_ASSET}" in
            *.tar.gz) tar -xzf "${archive}" -C "${runner_temp}" ;;
            *.zip) 7z x -y "-o${runner_temp}" "${archive}" >/dev/null ;;
            *) echo "unsupported sing-box archive: ${SING_BOX_ASSET}" >&2; exit 1 ;;
          esac

          core="${runner_temp}/${SING_BOX_DIRECTORY}/${SING_BOX_FILE_NAME}"
          license="${runner_temp}/${SING_BOX_DIRECTORY}/LICENSE"
          [[ -f "${core}" ]] || { echo "sing-box executable is missing" >&2; exit 1; }
          [[ -f "${license}" ]] || { echo "sing-box license is missing" >&2; exit 1; }

          if command -v shasum >/dev/null 2>&1; then
            core_sha256="$(shasum -a 256 "${core}" | awk '{print $1}')"
          else
            core_sha256="$(sha256sum "${core}" | awk '{print $1}')"
          fi
          {
            printf 'MAGIES_BUNDLED_SING_BOX_BIN=%s\n' "${core}"
            printf 'MAGIES_BUNDLED_SING_BOX_LICENSE=%s\n' "${license}"
            printf 'MAGIES_SING_BOX_SHA256=%s\n' "${core_sha256}"
          } >> "${github_env}"
      - name: Verify official Wintun
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:RUNNER_TEMP "mgclash-wintun"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $archive = Join-Path $tools "wintun-$env:WINTUN_VERSION.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $archive

          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WINTUN_ARCHIVE_SHA256) {
            throw "Wintun archive SHA-256 mismatch"
          }

          Expand-Archive -Path $archive -DestinationPath $tools
          $dll = Join-Path $tools "wintun/bin/amd64/wintun.dll"
          if ((Get-AuthenticodeSignature $dll).Status -ne "Valid") {
            throw "Wintun Authenticode signature is invalid"
          }
      - name: Expose Wintun packaging inputs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
          github_env="$(cygpath -u "${GITHUB_ENV}")"
          wintun="${runner_temp}/mgclash-wintun/wintun/bin/amd64/wintun.dll"
          license="${runner_temp}/mgclash-wintun/wintun/LICENSE.txt"
          [[ -f "${wintun}" ]] || { echo "Wintun DLL is missing" >&2; exit 1; }
          [[ -f "${license}" ]] || { echo "Wintun license is missing" >&2; exit 1; }
          {
            printf 'MAGIES_BUNDLED_WINTUN_DLL=%s\n' "${wintun}"
            printf 'MAGIES_BUNDLED_WINTUN_LICENSE=%s\n' "${license}"
          } >> "${github_env}"
      # The Intel runner must not silently produce an arm64 artifact.
      - name: Show compiler target
        run: rustc --version --verbose
      - name: Package the unsigned artifact
        shell: bash
        run: scripts/package-unsigned.sh "${{ github.workspace }}/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: mgclash-${{ matrix.target }}-unsigned
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
