[package]
name = "magies-desktop"
description = "MgClash Tauri desktop shell"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "magies_desktop_lib"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = "=0.4.45"
magies-core-runtime = { path = "../../../crates/magies-core-runtime" }
magies-domain = { path = "../../../crates/magies-domain" }
magies-platform = { path = "../../../crates/magies-platform" }
magies-profiles = { path = "../../../crates/magies-profiles" }
magies-routing = { path = "../../../crates/magies-routing" }
magies-session = { path = "../../../crates/magies-session" }
magies-storage = { path = "../../../crates/magies-storage" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "=0.35.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[lints]
workspace = true
